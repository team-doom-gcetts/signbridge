[package]
name = "signbridge"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = "0.33.5"
nokhwa = { version = "0.10.11", features = ["input-native", "output-wgpu", "rgb", "serde", "serialize"] }
serde = "1.0.229"
wgpu = "27"
winit = "0.30.13"
env_logger = "0.11"
pollster = { version = "1.0", features = ["macro"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
flume = "0.12.0"
futures = "0.3.34"
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tracing = { version = "0.1.44", features = ["async-await", "log"] }
tracing-subscriber = "0.3.23"
image = "0.25.10"
rayon = "1.12.0"
log = { version = "0.4.34", features = ["std"] }


